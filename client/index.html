<!doctype html>
<!--
  ==============================================================================
  File: client/index.html
  Purpose: The single HTML page skeleton that hosts our React Single Page Application (SPA).
  
  What this does:
  1. Provides the root container `<div id="root"></div>` where React renders the UI.
  2. Loads the entry script `/src/main.tsx`.
  ==============================================================================
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PathAI — AI Learning Path Generator</title>
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen">
    <!-- React mounts the entire application inside this root element -->
    <div id="root"></div>
    <!-- Entry point TypeScript script -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
